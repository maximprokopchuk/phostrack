<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e2d45"/>
    </linearGradient>
    <linearGradient id="drop" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Droplet shape: circle top + pointed bottom -->
  <path d="M256 96
           C256 96 140 210 140 300
           C140 366 192 416 256 416
           C320 416 372 366 372 300
           C372 210 256 96 256 96 Z"
        fill="url(#drop)" filter="url(#glow)"/>

  <!-- White N letter, bold, centered in the drop -->
  <text x="258" y="358"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="210"
        fill="white"
        fill-opacity="0.95"
        text-anchor="middle"
        dominant-baseline="auto">N</text>

</svg>
